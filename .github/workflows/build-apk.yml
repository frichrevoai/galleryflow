name: Build GalleryFlow APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '*.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore GalleryFlow source from ZIP (if needed)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f app/build.gradle && -f app/src/main/AndroidManifest.xml ]]; then
            echo "Android source module already present."
          else
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo "::error::The app/ folder is missing. Upload GalleryFlow-v0.20.0-source.zip to the repository root. This workflow will extract it automatically."
              exit 1
            fi
            echo "Extracting source bundle: $ZIP_FILE"
            unzip -oq "$ZIP_FILE" -d .
          fi
          test -f app/build.gradle || { echo "::error::Missing app/build.gradle after extraction."; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo "::error::Missing AndroidManifest.xml after extraction."; exit 1; }
          echo "GalleryFlow Android project found."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35 and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile GalleryFlow debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GalleryFlow-v0.20.0-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
